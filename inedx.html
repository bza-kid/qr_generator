<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Direct browser-to-browser temporary file transfer using WebRTC"
    >

    <title>Quick File Transfer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6fb;
            color: #172033;
        }

        .container {
            width: 100%;
            max-width: 560px;
            padding: 40px;
            text-align: center;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(23, 32, 51, 0.12);
        }

        .icon {
            margin-bottom: 16px;
            font-size: 52px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 32px;
        }

        p {
            margin: 8px 0;
            line-height: 1.6;
            color: #566074;
        }

        .status {
            margin-top: 24px;
            padding: 14px;
            font-weight: bold;
            color: #137333;
            background: #e9f7ed;
            border: 1px solid #b7e1c1;
            border-radius: 10px;
        }

        .note {
            margin-top: 24px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="icon" aria-hidden="true">⇄</div>

        <h1>Quick File Transfer</h1>

        <p>
            Transfer files directly between two browsers using WebRTC.
        </p>

        <p>
            Files are not permanently stored by this website.
        </p>

        <div class="status">
            Website setup successful
        </div>

        <p class="note">
            The file-transfer controls will be added in the next steps.
        </p>
    </main>
</body>
</html>
